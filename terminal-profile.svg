    <text x="20" y="234" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="14" fill="#aaaaaa" xml:space="preserve" class="fade-out1">  &quot;stack&quot;: [&quot;Python&quot;, &quot;Java&quot;, &quot;JavaScript&quot;, &quot;HTML&quot;, &quot;CSS&quot;],</text>
