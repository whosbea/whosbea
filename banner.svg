<svg xmlns="http://www.w3.org/2000/svg" width="854" height="180" viewBox="0 0 854 180" role="img" aria-label="Beatriz Barreto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d7a"/>
      <stop offset="100%" stop-color="#7132a8"/>
    </linearGradient>
    <style>
      .title {
        font-size: 36px;
        font-weight: 700;
        font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif;
        fill: #fafaf9;
      }
      .desc {
        font-size: 16px;
        font-weight: 500;
        font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif;
        fill: #fafaf9;
      }
      .title, .desc {
        animation: fadeIn 1.2s ease-in-out both;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .wave {
        animation: waveShift 8s ease-in-out infinite alternate;
      }
      @keyframes waveShift {
        from { transform: translateY(0); }
        to { transform: translateY(8px); }
      }
    </style>
  </defs>

  <rect width="854" height="180" fill="url(#bg)"/>
  <path class="wave" d="M0 118 Q 213 148 427 128 T 854 145 L 854 180 L 0 180 Z" fill="#3b1766" opacity="0.45"/>
  <path class="wave" d="M0 132 Q 213 108 427 138 T 854 128 L 854 180 L 0 180 Z" fill="#2a0f4d" opacity="0.35" style="animation-delay: -2s"/>

  <text class="title" text-anchor="middle" x="427" y="78">Beatriz Barreto</text>
  <text class="desc" text-anchor="middle" x="427" y="110">Software Engineering | Security &amp; AI</text>
</svg>
